# PostgreSQL temporal de Docker Compose.
spring.datasource.url=${DEV_DB_URL:jdbc:postgresql://localhost:5433/tienda_dev}
spring.datasource.username=${DEV_DB_USERNAME:tienda_dev}
spring.datasource.password=${DEV_DB_PASSWORD:dev_local}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.demo.enabled=true
